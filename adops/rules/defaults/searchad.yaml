# 검색광고형 기본 규칙
# - 위에 있는 규칙이 우선순위가 높다(같은 개체·같은 필드에 두 규칙이 걸리면 위 규칙만 쓴다).
# - 지표 이름과 단위는 docs/rules.md 참고. ROAS·CTR 같은 비율은 % 값이다(ROAS 300% → 300).
version: 1
platform: searchad_like

guardrails:
  max_change_pct: 30        # 변경 1건의 변경 폭 상한(%). 넘으면 미리보기에서 차단
  max_changes_per_day: 10   # 계정당 하루 반영 건수 상한
  cooldown_days: 1          # 같은 개체를 다시 바꾸기 전에 기다릴 날 수
  max_retries: 2            # 일시 오류(503 등) 재시도 횟수
  bounds:                   # 필드별 절대 하한·상한
    bid: {min: 70, max: 100000}
    daily_budget: {min: 10000, max: 1000000}

rules:
  - id: sa-budget-exhausted
    name: 예산 조기 소진 캠페인 일예산 증액
    entity: campaign
    when:
      all:
        - {metric: exhausted_days_7d, op: ">=", value: 3}
        - {metric: roas_7d, op: ">=", value: 300}
    action: {field: daily_budget, op: increase_pct, value: 20, round_to: 1000, max: 300000}
    risk: medium
    reason: >-
      최근 7일 중 {exhausted_days_7d} 일예산이 소진돼 평균 {avg_exhaust_hour_7d} 이후 노출이 멈췄고,
      ROAS {roas_7d}로 효율은 유지되고 있어 일예산을 늘립니다.

  - id: sa-bid-down-no-conversion
    name: 전환 없는 키워드 입찰가 인하
    entity: keyword
    when:
      all:
        - {metric: spend_7d, op: ">=", value: 50000}
        - {metric: conv_7d, op: "==", value: 0}
        - {metric: clicks_7d, op: ">=", value: 30}
    action: {field: bid, op: decrease_pct, value: 15, round_to: 10, min: 70}
    risk: low
    reason: >-
      최근 7일 {spend_7d}을 쓰고 클릭 {clicks_7d}회가 있었지만 전환이 없어 입찰가를 낮춥니다.

  - id: sa-bid-up-efficient
    name: 순위 낮고 효율 좋은 키워드 입찰가 인상
    entity: keyword
    when:
      all:
        - {metric: avg_rank_7d, op: ">=", value: 4.0}
        - {metric: roas_7d, op: ">=", value: 400}
        - {metric: conv_7d, op: ">=", value: 5}
        # 예산이 먼저 소진되는 캠페인에서는 입찰가를 올리면 소진만 빨라진다
        - {metric: campaign_exhausted_days_7d, op: "<", value: 3}
    action: {field: bid, op: increase_pct, value: 10, round_to: 10, max: 3000}
    risk: medium
    reason: >-
      평균 {avg_rank_7d}로 노출 순위가 낮지만 ROAS {roas_7d}, 전환 {conv_7d}건으로 효율이 좋고
      캠페인 예산에도 여유가 있어 입찰가를 올립니다.
